name: nodeJS CI

env:
  IMAGE_TAG: ${{github.run_number}}
  IMAGE_NAME: mohdkhalandar/node-js-application-docker

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build_application:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Install dependencies
      - name: Install Dependencies
        run: npm install

      # Build Docker image
      - name: Build Docker Image
        run: |
          docker build -t $IMAGE_NAME:$IMAGE_TAG .
          docker images

      - name: List Images
        run: docker images

      - name: Run Docker Image
        run: docker run -d -p 8080:8080 $IMAGE_NAME:$IMAGE_TAG

      - name: list Docker container
        run: docker ps
