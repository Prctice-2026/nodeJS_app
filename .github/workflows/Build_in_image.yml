name: Build in Docker Image nodeJS CI

env:
  IMAGE_TAG: ${{github.run_number}}
  IMAGE_NAME: mohdkhalandar/node-js-application-docker

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build_application:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      # Build Docker image
      - name: Build Docker Image
        run: |
          docker build -t $IMAGE_NAME:$IMAGE_TAG .
          docker images

      - name: List Images
        run: docker images

      - name: Run Docker Image
        run: docker run -d -p 9981:9981 $IMAGE_NAME:$IMAGE_TAG

      - name: list Docker container
        run: docker ps

      - name: Get Runner Public IP
        run: curl ifconfig.me

      - name: Check Container Logs
        run: docker logs $(docker ps -q)

      - name: Wait for App Startup
        run: sleep 30

        

      - name: Test App Locally Inside Runner
        run: curl http://localhost:9981
