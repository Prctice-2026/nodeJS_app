name: Push NodeJS App to AWS ECR and Deploy to EKS CI

on:
  push:
    branches:
      - master

env:
  IMAGE_TAG: ${{ github.run_number }}
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: nodejs-web-app-docker-image
  ECR_REGISTRY: <YOUR_AWS_ACCOUNT_ID>.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

  # EKS variables
  EKS_CLUSTER_NAME: my-eks-cluster
  K8S_DEPLOYMENT_NAME: nodejs-web-app-deployment

jobs:
  build_push_deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout source code
      - name: Checkout Job
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Install dependencies
      - name: Install Dependencies
        run: npm install

      # Optional: Run tests
      - name: Run Tests
        run: npm test

      # Configure AWS credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Login to AWS ECR
      - name: Login to AWS Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Build Docker image
      - name: Build Docker Image
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker images

      # Push Docker image
      - name: Push Docker Image to ECR
        run: |
          echo "Pushing Docker Image to AWS ECR"
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # Update kubeconfig for EKS
      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER_NAME

      # Check cluster connectivity
      - name: Check Kubernetes Nodes
        run: kubectl get nodes

      # Update image tag in Kubernetes deployment YAML
      - name: Update Image Tag in Deployment YAML
        run: |
          sed -i "s|image: .*|image: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG|g" nodejs-app.yml
          cat nodejs-app.yml

      # Deploy to EKS
      - name: Deploy to EKS
        run: kubectl apply -f nodejs-app.yml

      # Verify rollout
      - name: Verify Deployment Rollout
        run: kubectl rollout status deployment/$K8S_DEPLOYMENT_NAME

      # Check pods
      - name: Check Running Pods
        run: kubectl get pods

      # Check services
      - name: Check Services
        run: kubectl get svc
